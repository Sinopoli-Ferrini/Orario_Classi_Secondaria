        ["ART","LET+STO","MAT","LETX","MOT","MAT","MAT","MUS","FRA","MUS","MOT","MAT","MAT","LET+STO","LET+STO","ING","MUS","MAT","ING","LET+STO+GEO","TEC","LETX","LET+STO+GEO","FRA","MAT","LET+STO","LET+STO"],
        ["MAT","LET+STO","LET","ING","STO+GEO","MUS","TEC","LET+STO","ART","LETX","MAT","FRA","LETX","MAT","MOT","MAT","ING","MOT","MAT","LET+STO+GEO","ING","LET+STO","LET+STO+GEO","LET+STO","MUS","TEC","FRA"],
        // Giovedì (Ore 1-6)
        ["MAT","MOT","STO+GEO","LET+STO","MAT","ART","MAT","GEO_C","TEC","MAT","TEC","LET","MAT","LET+STO","FRA","LETX","MAT","STO+GEO","ART","FRA","MAT","LET+STO","MUS","MUS","MOT","MAT","LETX"],
        ["MAT","FRA","TEC","LET+STO","MAT","LET+STO+GEO","GEO","ART","MAT","LET","MAT","TEC","MAT","MUS","ART","MOT","ING","STO+GEO","STO+GEO","MUS","MATX","LET+STO","MAT","MOT","ART","MATX","LET+STO"],
        ["ING","GEO","MAT","ART","MUS","LET+STO+GEO","MOT","ING","MATX","TEC","LET+STO","MATX","REL","GEO","MAT","LET","FRA","MUS","MOT","MAT","FRA","GEO","MAT","LET+STO","MAT","ING","LET+T"],
        ["TEC","ING","FRA","MAT","ING","FRA","LET+STO","ING","ING","MOT","LET+STO","STO+GEO","MOT","ING","GEO","STO+GEO","TEC","MAT","FRA","ART","LET+STO+GEO","ART","LET+STO+GEO","LET+STO","MAT","ING","GEO"],
        ["STO+GEO","LET+STO","LET","MAT","LET","MOT","ING","LET+STO","MUS","ART","FRA","ING","TEC","REL","LET+STO","MAT","LET+STO+GEO","ING","LETX","ING","LET+STO+GEO","FRA","ART","LETX","LET+STO","MOT","ING"],
        ["STO+GEO","MUS","LETX","TEC","FRA","LETX","ING","LET+STO","MOT","ING","REL","ART","LET","FRA","ING","STO+GEO","LET+STO+GEO","ART","STO+GEO","LET+STO+GEO","MOT","ING","LET+STO+GEO","ING","LET+STO","LET+STO","MAT"],
        // Venerdì (Ore 1-6)
        ["REL","GEO_A","MATX","GEO","STO+GEO","ING","ART","FRA","ING","LET","MAT","ING","ING","TEC","MATX","FRA","LET+STO+GEO","MOT","LET","TEC","LET+STO+GEO","MUS","MAT","MAT","FRA","GEO","MAT"],
        ["LET","MAT","ING","ING","LETX","TEC","FRA","TEC","ART","LET","MAT","MOT","LET","ING","MAT","REL","LET+STO+GEO","FRA","MUS","LETX","LET+STO+GEO","MAT","MOT","MAT","LETX","FRA","MAT"],
        ["MOT","MAT","LET","LET+STO","LET","MAT","REL","GEO","LET+STO","MAT","ING","STO+GEO","ART","MAT","ING","MUS","MAT","MAT","MAT","LET+STO+GEO","LET+STO+GEO","LET+STO","ING","FRA","TEC","MAT","MOT"],
        ["MATX","ART","REL","MUS","TEC","MAT","LET+STO","MOT","MAT","STO+GEO","MUS","STO+GEO","LET","MAT","MUS","ING","MOT","MAT","TEC","MAT","ART","MATX","TEC","ING","LET+STO","LET+STO","FRA"],
        ["MUS","TEC","ART","FRA","MAT","LET+STO+GEO","LET+STO","MAT","LET+STO","STO+GEO","ART","MAT","STO+GEO","MOT","LET+STO","TEC","ART","LET","ING","MOT","MAT","TEC","LET+STO+GEO","LET+STO","MUS","REL","MUS"],
        ["ART","LET+STO","MUS","MOT","MAT","LET+STO+GEO","MAT","LET+STO","LETX","MUS","GEO","LETX","STO+GEO","ART","TEC","MAT","MUS","STO+GEO","REL","MAT","TEC","MOT","FRA","LET+STO","ING","ART","TEC"]
    ];
    const giorni = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì"];
    
    function decodificaMateria(rawMat) {
        let h = rawMat.trim().toUpperCase();
        if (h.endsWith("X") && h.length > 3) h = h.slice(0, -1);
        if (h.includes("_")) h = h.split("_")[0];
        
        if (h === "LET+STO+GEO") return { nome: "Let/Sto/Geo", cls: "color-letstogeo" };
        if (h === "LET+STO" || h === "LET") return { nome: "Lettere/Storia", cls: "color-letterestoria" };
        if (h === "GEO") return { nome: "Geografia", cls: "color-geografia" };
        if (h === "ING") return { nome: "Inglese", cls: "color-inglese" };
        if (h === "MAT" || h === "MATX") return { nome: "Matematica", cls: "color-matematica" };
        if (h === "STO+GEO") return { nome: "Storia e Geo.", cls: "color-storiageo" };
        if (h === "TEC") return { nome: "Tecnologia", cls: "color-tecnologia" };
        if (h === "REL") return { nome: "Religione", cls: "color-religione" };
        if (h === "MUS") return { nome: "Musica", cls: "color-musica" };
        if (h === "FRA") return { nome: "Francese", cls: "color-francese" };
        if (h === "MOT") return { nome: "Ed. Fisica", cls: "color-fisica" };
        if (h === "ART") return { nome: "Arte e Imm.", cls: "color-arte" };
        return { nome: h, cls: "" };
    }

    const select = document.getElementById("classeSelect");
    classiIstituito.forEach(c => {
        let opt = document.createElement("option"); opt.value = c; opt.textContent = c; select.appendChild(opt);
    });

    function navigaClasse(direzione) {
        const classeCorrente = select.value; let nuovoIndice = 0;
        if (classeCorrente) { let idxAttuale = classiIstituito.indexOf(classeCorrente); nuovoIndice = idxAttuale + direzione; }
        else { nuovoIndice = direzione > 0 ? 0 : classiIstituito.length - 1; }
        if (nuovoIndice >= 0 && nuovoIndice < classiIstituito.length) { select.value = classiIstituito[nuovoIndice]; mostraOrario(); }
    }

    function aggiornaStatoPulsanti() {
        const val = select.value; const btnPrev = document.getElementById("btnPrev"); const btnNext = document.getElementById("btnNext"); const btnPrint = document.getElementById("btnPrint");
        if (!val) { btnPrev.disabled = false; btnNext.disabled = false; btnPrint.style.display = "none"; return; }
        let idx = classiIstituito.indexOf(val); btnPrev.disabled = (idx === 0); btnNext.disabled = (idx === classiIstituito.length - 1);
        btnPrint.style.display = "inline-block";
    }

    function mostraOrario() {
        const classe = select.value; const tabella = document.getElementById("tabellaOrario"); const corpo = document.getElementById("corpoTabella"); const msg = document.getElementById("messaggioIniziale"); const titolo = document.getElementById("titoloPagina");
        corpo.innerHTML = ""; aggiornaStatoPulsanti();
        if (!classe) { tabella.style.display = "none"; msg.style.display = "block"; titolo.textContent = "Orario Scolastico"; return; }
        msg.style.display = "none"; tabella.style.display = "table"; titolo.textContent = "Orario Scolastico - Classe " + classe;
        const colIdx = classiIstituito.indexOf(classe);
        
        for (let ora = 0; ora < 6; ora++) {
            let tr = document.createElement("tr");
            let tdOra = document.createElement("td"); tdOra.style.fontWeight = "bold"; tdOra.textContent = (ora + 1) + "° Ora"; tr.appendChild(tdOra);
            
            giorni.forEach((giorno, gIdx) => {
                let td = document.createElement("td"); let rowIdx = (gIdx * 6) + ora;
                let doc = databaseDocenti[rowIdx] ? databaseDocenti[rowIdx][colIdx] : "-";
                let mat = databaseMaterie[rowIdx] ? databaseMaterie[rowIdx][colIdx] : "-";
                doc = doc ? doc.trim() : "-"; mat = mat ? mat.trim() : "-";
                
                if (doc.startsWith("ZZ") || doc.startsWith("ZZT") || doc === "-" || doc === "" || mat === "L" || doc.length > 20) { 
                    td.textContent = "-"; 
                } else {
                    let infoMateria = decodificaMateria(mat);
                    if (infoMateria.nome === doc) infoMateria.nome = "Lezione";
                    if (infoMateria.cls) td.classList.add(infoMateria.cls);
                    
                    td.innerHTML = `<div class="cell-content">
                        <div class="materia">${infoMateria.nome}</div>
                        <div class="docente">${doc}</div>
                    </div>`;
                }
                tr.appendChild(td);
            });
            corpo.appendChild(tr);
        }
    }
    aggiornaStatoPulsanti();
</script>
